name: Django CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
  
      - name: Run Flake8
        run: |
          flake8 campusZen/ --max-line-length=250

      - name: Run Pylint
        run: |
          pylint campusZen/*.py --exit-zero | tee pylint-report.txt
          score=$(tail -n 2 pylint-report.txt | grep "rated at" | sed -E 's/.* ([0-9]+\.[0-9]+)\/10.*/\1/')
          echo "Pylint score: $score"
          awk -v s="$score" 'BEGIN { if (s < 8.0) exit 1 }'

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Run tests
        run: |
          coverage run manage.py test ./campusZen/tests
          coverage report --fail-under=80



